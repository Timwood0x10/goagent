version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
    - gci
  settings:
    gci:
      custom-order: true
      sections:
        - standard
        - default
        - prefix(github.com/Timwood0x10/ares)
# NOTE: goimports was replaced by gci. golangci-lint v2.13.x embeds
# golang.org/x/tools v0.49.0 whose imports.Process calls modindex.Read()
# per file with NO caching. With a ~25MB modindex payload and 14-way
# parallel analysis, this caused 800%+ CPU and multi-minute hangs.
# gci uses a completely different implementation (daixiang0/gci) that
# does not scan GOMODCACHE, making it orders of magnitude faster.
# See: docs/bug@ques/zh/goimports-modindex-cpu-spike.md

# NOTE: the old v1 top-level `linters-settings` block (gocyclo=15,
# goconst 3/5, gocritic tags) was silently IGNORED by golangci-lint v2.
# Migrating it verbatim into v2 `settings` would activate it for the first
# time and surface ~200 legacy violations (100+ functions above cyclomatic
# 15). That cleanup is its own project; until then this config intentionally
# runs v2 defaults, matching the previously EFFECTIVE behavior.
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - bodyclose
    - whitespace
    - misspell
    - gocyclo
    - gocritic
    - goconst
    - unconvert
    - gosec
    - nilnil
    - prealloc
    - noctx
    # Potential additions evaluated 2026-08-30, deferred:
    #   nilerr       — 48 issues, ~90% are intentional Result{Data: err.Error()}, nil
    #                  pattern (business error wrapped in result struct, nil error).
    #   contextcheck — 50 issues across examples/ and internal packages; needs
    #                  a dedicated context-propagation cleanup pass.
    #   nilaway      — not available as a golangci-lint v2 linter; would need
    #                  to run as a separate binary in CI.
  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - gocyclo
          - goconst
          - prealloc
          - noctx
          - gosec
          - nilnil
      - path: examples/
        linters:
          - goconst
          - noctx
          - gosec
      - path: cmd/
        linters:
          - goconst
          - noctx
          - gosec
      - path: internal/storage/postgres/write_buffer.go
        linters:
          - noctx
      - path: internal/tools/resources/builtin/embedding/embedding.go
        linters:
          - noctx
      - path: internal/ares_quant/
        linters:
          - noctx
      # Tool parameter schema definitions: string map keys in schema definitions
      # are idiomatic and extracting them to constants reduces readability.
      - path: internal/tools/resources/builtin/math/
        linters:
          - goconst
      - path: internal/tools/resources/builtin/network/
        linters:
          - goconst
      - path: internal/tools/resources/builtin/file/
        linters:
          - goconst
      # LLM request/response JSON field names must match external API formats;
      # keeping them as string literals is clearer than indirection via constants.
      - path: internal/llm/
        linters:
          - goconst
      # Tool schema parameter definitions: map keys in schema definitions.
      - path: internal/tools/resources/builtin/memory/
        linters:
          - goconst
      - path: internal/tools/resources/builtin/knowledge/
        linters:
          - goconst
      - path: internal/tools/resources/builtin/stringutils/
        linters:
          - goconst
      - path: internal/tools/resources/builtin/hash/
        linters:
          - goconst
      # Arena event/status field names.
      - path: internal/runtime/arena/
        linters:
          - goconst
      # Workflow engine configuration strings.
      - path: internal/fabric/task/workflow/engine/
        linters:
          - goconst
      # Config defaults: paths, default values repeated for documentation.
      - path: internal/ares_config/config.go
        linters:
          - goconst
      - path: internal/storage/postgres/config.go
        linters:
          - goconst
      - path: internal/llmservice/service.go
        linters:
          - goconst
      - path: internal/ares_quant/dataflow/
        linters:
          - goconst
      - path: api/client/config.go
        linters:
          - goconst
      - path: api/handler/stream.go
        linters:
          - goconst
      # Storage service query field names.
      - path: internal/storage/postgres/services/
        linters:
          - goconst
      # Planner capability/tool metadata map keys and schema strings.
      - path: internal/tools/planner/
        linters:
          - goconst
      # Toolsource keyword→capability map keys are a data table; some keys
      # ("math", "calc", "http") coincide with test fixture tool names, which
      # inflates goconst counts. Same pattern as the planner exemption above.
      - path: internal/tools/toolsource/capability_selector.go
        linters:
          - goconst
      # Tool result formatter format strings.
      - path: internal/tools/resources/formatter/
        linters:
          - goconst
      # Evolution guardrail/dream-cycle status strings.
      - path: internal/runtime/ares_evolution/
        linters:
          - goconst
      # Shutdown manager event/status strings.
      - path: internal/ares_shutdown/
        linters:
          - goconst
      # Runtime manager field names.
      - path: internal/ares_runtime/manager.go
        linters:
          - goconst
      # Quant tool/research parameter field names.
      - path: internal/ares_quant/portfolio/
        linters:
          - goconst
      - path: internal/ares_quant/tools.go
        linters:
          - goconst
      # API implementation helper strings.
      - path: internal/api_impl/
        linters:
          - goconst
      # System tool parameter schema definitions.
      - path: internal/tools/resources/builtin/system/
        linters:
          - goconst
      # Eval LLM judge/report status strings.
      - path: internal/runtime/eval/llm_judge.go
        linters:
          - goconst
      - path: internal/runtime/eval/report.go
        linters:
          - goconst
      # Tool schema definitions.
      - path: internal/tools/resources/builtin/planning/
        linters:
          - goconst
      - path: internal/tools/resources/builtin/builtin.go
        linters:
          - goconst
      - path: internal/tools/resources/core/
        linters:
          - goconst
      - path: internal/tools/resources/builtin/execution/
        linters:
          - goconst
      # Distillation internal strings.
      - path: internal/runtime/memory/distillation/
        linters:
          - goconst
      # Observability metric label names.
      - path: internal/runtime/observability/
        linters:
          - goconst
      # API tool schema parameter/result field names.
      - path: internal/apitools/builtin.go
        linters:
          - goconst
      # Memory manager event payload field names.
      - path: internal/runtime/memory/manager_impl.go
        linters:
          - goconst
      - path: internal/runtime/memory/production_manager.go
        linters:
          - goconst
      - path: internal/runtime/memory/embedding/spec.go
        linters:
          - goconst
      # Text tool schema definitions.
      - path: internal/tools/resources/builtin/text/
        linters:
          - goconst
      # Discovery binary provider metadata field names.
      - path: internal/discovery/providers/binary.go
        linters:
          - goconst
      # Runtime router/outcome recorder field names.
      - path: internal/ares_runtime/router.go
        linters:
          - goconst
      - path: internal/ares_runtime/outcome_recorder.go
        linters:
          - goconst
      # Security sanitizer pattern strings.
      - path: internal/ares_security/sanitizer.go
        linters:
          - goconst
      # API client health check strings.
      - path: api/client/health.go
        linters:
          - goconst
      # MCP server config map keys.
      - path: internal/mcpclient/mcp.go
        linters:
          - goconst
      # Event compactor status strings.
      - path: internal/ares_events/compactor.go
        linters:
          - goconst
      # Memory pipeline config strings.
      - path: internal/runtime/memory/pipeline.go
        linters:
          - goconst
      - path: internal/runtime/memory/report/generator.go
        linters:
          - goconst
      # Secret adapter meta-key strings.
      - path: internal/storage/postgres/adapters/secret_adapter.go
        linters:
          - goconst
      # Embedding tool schema parameter names.
      - path: internal/tools/resources/builtin/embedding/embedding.go
        linters:
          - goconst
      # envcap capability-search tool schema/parameter/result field names.
      - path: internal/tools/envcap/
        linters:
          - goconst
      # Legacy api/* consumers: the api/* layer is deprecated in favor of
      # sdk/; these paths still reference the old packages during the
      # migration window and are wired to migrate incrementally.
      - path: api/(bootstrap|client|router|service/workflow)/
        text: "SA1019"
      - path: cmd/ares/(agent_cli|workflow_cli)\.go
        text: "SA1019"
      - path: internal/(api_impl|ares_memory/(context|distillation|experienceadapters)|knowledge/service)/
        text: "SA1019"
      - path: examples/
        text: "SA1019"
    paths:
      - third_party$

issues:
  max-issues-per-linter: 100
  max-same-issues: 50
